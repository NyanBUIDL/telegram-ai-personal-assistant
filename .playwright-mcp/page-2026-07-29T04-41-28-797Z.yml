    - generic [ref=e604]:
      - paragraph [ref=e605]: Hướng dẫn vận hành Telegram AI Personal Assistant. Phần nội dung này dài có chủ đích để kiểm tra scroll nội bộ và footer luôn truy cập được.
      - heading "Mục tiêu" [level=3] [ref=e606]
      - paragraph [ref=e607]: Ứng dụng biến lịch sử chat được owner cấp quyền trong các group và channel Telegram thành một kho tri thức chung. “Học” là đồng bộ vào MySQL, làm sạch, tạo embedding và lập chỉ mục để truy xuất; ứng dụng không tự fine-tune model.
      - heading "Bắt đầu" [level=3] [ref=e608]
      - paragraph [ref=e609]: Mở dashboard local, đăng nhập bằng mã owner dùng một lần, sau đó kiểm tra trạng thái Admin API và SSE. Chỉ khi header báo LIVE thì snapshot mới được xem là realtime.
      - heading "Cấp quyền cho nguồn" [level=3] [ref=e610]
      - paragraph [ref=e611]: Tìm group hoặc channel theo tên, username hay Chat ID. Bật ALLOW trước, rồi chỉ bật các quyền cần dùng. Hành động nhạy cảm luôn đi qua preview và owner confirmation.
      - heading "Đưa nguồn vào bộ não chung" [level=3] [ref=e612]
      - paragraph [ref=e613]: Chọn nguồn trong Knowledge, kiểm tra số tin MySQL, vector, dung lượng và lần học gần nhất. Toolbar bulk xuất hiện khi có lựa chọn và ghi rõ phạm vi tác động.
      - heading "Theo dõi Learning Jobs" [level=3] [ref=e614]
      - paragraph [ref=e615]: Queued bắt đầu ở 0%; syncing dùng vùng 1–50%; embedding dùng 51–99%; completed luôn là 100%. Failed và paused giữ tiến độ hợp lệ cuối cùng. Khi backend không cung cấp mẫu số tin cậy, giao diện không hiển thị phần trăm.
      - heading "An toàn vận hành" [level=3] [ref=e616]
      - paragraph [ref=e617]: Không render secret đã lưu. Mọi thay đổi provider, model, policy hoặc xóa dữ liệu đều phải có impact preview. Khi session hết hạn, quay lại đăng nhập thay vì retry SSE với credential cũ.
